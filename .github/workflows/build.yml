name: Build & publish openmausbot-repo

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: openmausbot-repo
  cancel-in-progress: false

env:
  REPO_NAME: openmausbot-repo
  RELEASE_TAG: repo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Cek semua paket & update PKGBUILD jika ada rilis baru
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          : > .build_targets
          mkdir -p existing-db

          release_assets=""
          db_entries=""
          if assets_json=$(gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --json assets 2>/dev/null); then
            release_assets=$(jq -r '.assets[].name' <<< "$assets_json")
            db_url=$(jq -r --arg n "${REPO_NAME}.db.tar.gz" '.assets[] | select(.name == $n) | .url // empty' <<< "$assets_json")
            if [[ -n "$db_url" ]]; then
              echo "Mengunduh ${REPO_NAME}.db.tar.gz untuk verifikasi entri..."
              curl -fsSL --retry 3 -o "existing-db/${REPO_NAME}.db.tar.gz" "$db_url"
              db_entries=$(tar -tzf "existing-db/${REPO_NAME}.db.tar.gz")
            fi
          fi

          while IFS= read -r pkg_json; do
            pkgname=$(jq -r '.pkgname' <<< "$pkg_json")
            dir=$(jq -r '.dir' <<< "$pkg_json")
            upstream=$(jq -r '.upstream' <<< "$pkg_json")
            asset_regex=$(jq -r '.asset_regex' <<< "$pkg_json")
            version_sed=$(jq -r '.version_sed' <<< "$pkg_json")
            deb_template=$(jq -r '.deb_name_template' <<< "$pkg_json")

            echo "=== Mengecek ${pkgname} (${upstream}) ==="
            gh api "repos/${upstream}/releases/latest" > latest.json

            tag=$(jq -r '.tag_name' latest.json)
            deb=$(jq -r --arg re "$asset_regex" '[.assets[].name | select(test($re))] | first // empty' latest.json)
            if [[ -z "$deb" ]]; then
              echo "::error::Tidak ada asset cocok (${asset_regex}) di rilis ${upstream}@${tag}"
              exit 1
            fi

            version=$(printf '%s' "$deb" | sed -E "$version_sed")
            url="https://github.com/${upstream}/releases/download/${tag}/${deb}"

            # GitHub menyediakan digest sha256 pada asset rilis. Kalau tidak ada,
            # unduh file untuk dihash manual.
            digest=$(jq -r --arg n "$deb" '.assets[] | select(.name == $n) | .digest // empty' latest.json)
            if [[ -n "$digest" ]]; then
              sha="${digest#sha256:}"
            else
              echo "digest tidak tersedia untuk ${deb}, mengunduh untuk dihash"
              curl -fsSL --retry 3 -o upstream.deb "$url"
              sha=$(sha256sum upstream.deb | awk '{print $1}')
              rm -f upstream.deb
            fi

            pkgbuild="${dir}/PKGBUILD"
            current=$(sed -n 's/^pkgver=//p' "$pkgbuild" | head -n1)

            # Self-healing: pastikan asset .pkg.tar.zst dan entri di .db.tar.gz
            # sama-sama sudah ada untuk versi PKGBUILD saat ini.
            published=false
            if printf '%s\n' "$release_assets" | grep -qE "^${pkgname}-${current}-[0-9]+-.*\.pkg\.tar\.zst$" \
               && printf '%s\n' "$db_entries" | grep -qE "^${pkgname}-${current}-[0-9]+/desc$"; then
              published=true
            fi

            if [[ "$version" == "$current" && "$published" == "true" ]]; then
              echo "${pkgname}: sudah up to date (${version}) dan paket sudah terbit. Skip."
              continue
            fi

            echo "${pkgname}: perlu build (PKGBUILD=${current}, upstream=${version}, published=${published})"

            deb_name="${deb_template//\{version\}/$version}"
            sed -i "s/^pkgver=.*/pkgver=${version}/" "$pkgbuild"
            sed -i "s/^pkgrel=.*/pkgrel=1/" "$pkgbuild"
            sed -i "s|^source=(.*|source=(\"${deb_name}::${url}\")|" "$pkgbuild"
            sed -i "s/^sha256sums=(.*/sha256sums=('${sha}')/" "$pkgbuild"

            grep -E '^(pkgver|pkgrel|source|sha256sums)=' "$pkgbuild"
            printf '%s|%s|%s\n' "$dir" "$pkgname" "$version" >> .build_targets
          done < <(jq -c '.[]' packages.json)

          if [[ -s .build_targets ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Daftar paket yang akan di-build:"
            cat .build_targets
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Semua paket sudah up to date. Tidak ada yang perlu di-build."
          fi

      - name: Build di container archlinux:base-devel (user non-root) + repo-add
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          mkdir -p dist repo

          # Ambil database repo yang sudah ada supaya paket yang tidak di-rebuild
          # tetap ada di .db dan .files.
          if assets_json=$(gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --json assets 2>/dev/null); then
            db_url=$(jq -r --arg n "${REPO_NAME}.db.tar.gz" '.assets[] | select(.name == $n) | .url // empty' <<< "$assets_json")
            files_url=$(jq -r --arg n "${REPO_NAME}.files.tar.gz" '.assets[] | select(.name == $n) | .url // empty' <<< "$assets_json")
            if [[ -n "$db_url" && -n "$files_url" ]]; then
              echo "Mengunduh database repo yang sudah ada..."
              curl -fsSL --retry 3 -o "repo/${REPO_NAME}.db.tar.gz" "$db_url"
              curl -fsSL --retry 3 -o "repo/${REPO_NAME}.files.tar.gz" "$files_url"
            fi
          fi

          # Script yang jalan sebagai root di container: siapkan user non-root.
          cat > .build.sh <<'ROOT_SCRIPT'
          set -euo pipefail
          pacman -Syu --noconfirm --needed ca-certificates fakeroot
          getent group "$HOST_GID" >/dev/null || groupadd -g "$HOST_GID" builder
          id builder >/dev/null 2>&1 || useradd -m -u "$HOST_UID" -g "$HOST_GID" builder
          chown -R "$HOST_UID:$HOST_GID" /work
          su builder -s /bin/bash -c 'export HOME=/home/builder; bash /work/.build-user.sh'
          ROOT_SCRIPT

          # Script makepkg + repo-add. UID builder disamakan dengan user runner
          # supaya hasil build bisa dibaca/di-upload dari host.
          cat > .build-user.sh <<'USER_SCRIPT'
          set -euo pipefail

          while IFS='|' read -r dir pkgname version; do
            [[ -z "$dir" ]] && continue
            echo "=== Building ${pkgname} (${version}) di ${dir} ==="
            cd "/work/${dir}"

            # --nodeps: dependency runtime tidak perlu terpasang saat build,
            # karena paket ini hanya membongkar biner .deb yang sudah jadi.
            makepkg --noconfirm --clean --nodeps
            rm -f ./*.deb
            mv ./*.pkg.tar.zst /work/repo/
          done < /work/.build_targets

          cd /work/repo

          # Tambahkan/perbarui hanya paket yang baru di-build ke database repo.
          repo-add "$REPO_NAME.db.tar.gz" ./*.pkg.tar.zst

          # GitHub Releases tidak menyimpan symlink. Timpa symlink .db dan
          # .files dengan salinan isi file .tar.gz masing-masing.
          for link in "$REPO_NAME.db" "$REPO_NAME.files"; do
            if [ -L "$link" ]; then
              cp -L "$link" "$link.tmp"
              mv -f "$link.tmp" "$link"
            fi
          done

          cp -L ./*.pkg.tar.zst ../dist/
          cp -L "$REPO_NAME.db" "$REPO_NAME.db.tar.gz" \
                "$REPO_NAME.files" "$REPO_NAME.files.tar.gz" ../dist/
          USER_SCRIPT

          chmod +x .build.sh .build-user.sh

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -e REPO_NAME="$REPO_NAME" \
            archlinux:base-devel \
            bash /work/.build.sh

          sudo chown -R "$(id -u):$(id -g)" dist repo packages 2>/dev/null || true
          ls -l dist

      - name: Commit PKGBUILD ke branch main
        if: steps.check.outputs.changed == 'true'
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/*/PKGBUILD

          if git diff --cached --quiet; then
            echo 'PKGBUILD tidak berubah, tidak ada commit.'
          else
            summary=$(awk -F'|' '{printf "%s%s %s", (NR>1?", ":""), $2, $3}' .build_targets)
            git commit -m "chore: update ${summary}"
            git push origin HEAD:main
          fi

      - name: Upload ke release "repo" (tag tetap)
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if ! gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              -R "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" \
              --target main \
              --notes "Database dan paket pacman untuk ${REPO_NAME}. Tag ini sengaja tetap agar URL di pacman.conf tidak berubah."
          fi

          # Hapus hanya asset .pkg.tar.zst lama milik paket yang ikut di-rebuild.
          # Paket lain yang tidak berubah tetap dibiarkan di release.
          existing_assets=$(gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          while IFS='|' read -r dir pkgname version; do
            [[ -z "$pkgname" ]] && continue
            old_assets=$(printf '%s\n' "$existing_assets" \
              | grep -E "^${pkgname}-[0-9].*\.pkg\.tar\.zst$" || true)
            if [[ -n "$old_assets" ]]; then
              while IFS= read -r asset; do
                echo "Menghapus asset lama: ${asset}"
                gh release delete-asset "$RELEASE_TAG" "$asset" -R "$GITHUB_REPOSITORY" -y
              done <<< "$old_assets"
            fi
          done < .build_targets

          # Nama database (.db, .files, .tar.gz) sama setiap build -> ditimpa.
          gh release upload "$RELEASE_TAG" \
            -R "$GITHUB_REPOSITORY" \
            dist/*.pkg.tar.zst \
            "dist/${REPO_NAME}.db" \
            "dist/${REPO_NAME}.db.tar.gz" \
            "dist/${REPO_NAME}.files" \
            "dist/${REPO_NAME}.files.tar.gz" \
            --clobber

          echo "Selesai. https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
